[versions]
slackApi = "1.46.0"
sykepengerGradlePlugins = "20261001.1830"

[libraries]
ktor-client-cio = { module = "io.ktor:ktor-client-cio" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-server-callLogging = { module = "io.ktor:ktor-server-call-logging" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-testHost = { module = "io.ktor:ktor-server-test-host" }

jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

logback-classic = { module = "ch.qos.logback:logback-classic" }
logstash-logback-encoder = "net.logstash.logback:logstash-logback-encoder:9.0"

slack-api-client-kotlinExtension = { module = "com.slack.api:slack-api-client-kotlin-extension", version.ref = "slackApi" }
slack-api-model-kotlinExtension = { module = "com.slack.api:slack-api-model-kotlin-extension", version.ref = "slackApi" }

google-cloud-storage = "com.google.cloud:google-cloud-storage:2.60.0"

mockk = "io.mockk:mockk:1.13.17"

[bundles]
ktor-client = [
    "ktor-client-cio",
    "ktor-client-core",
]
ktor-server = [
    "ktor-serialization-jackson",
    "ktor-serialization-kotlinxJson",
    "ktor-server-callLogging",
    "ktor-server-cio",
    "ktor-server-contentNegotiation",
    "ktor-server-core",
]

[plugins]
sykepenger-deployable = { id = "no.nav.sykepenger.deployable", version.ref = "sykepengerGradlePlugins" }
